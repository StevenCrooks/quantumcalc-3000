<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuantumCalc 3000 - Fixed</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&family=JetBrains+Mono:wght@400;700&display=swap');
*{box-sizing:border-box}body{margin:0;background:radial-gradient(120% 120% at 50% -10%,#1e1b4b 0%,#060a12 60%);color:#e2e8f0;font-family:'Outfit',sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:10;backdrop-filter:blur(24px);background:rgba(6,10,18,0.85);border-bottom:1px solid rgba(255,255,255,0.12);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;background:linear-gradient(90deg,#7c3aed,#06ffa5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:20px}
.glass{backdrop-filter:blur(24px);background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.1)}
#container{max-width:1200px;margin:16px auto;padding:0 12px;display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){#container{grid-template-columns:1.2fr 0.8fr}}
.calc{padding:16px}
.display{background:rgba(0,0,0,0.45);border-radius:16px;padding:14px;border:1px solid rgba(255,255,255,0.12);min-height:84px}
#expr{font-family:'JetBrains Mono',monospace;opacity:0.7;font-size:14px;min-height:20px;word-break:break-all}
#result{font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:700;text-align:right}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{padding:15px 8px;border-radius:14px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:white;font-weight:600;cursor:pointer;transition:.12s;font-size:15px}
button:active{transform:scale(0.96)}button.op{background:rgba(124,58,237,0.28);border-color:rgba(124,58,237,0.5)}button.eq{background:linear-gradient(135deg,#7c3aed,#06ffa5);border:none;font-weight:900;font-size:18px}
#canvasWrap{height:460px;position:relative;overflow:hidden}
#three{width:100%;height:100%;display:block;border-radius:24px}
.controls{position:absolute;bottom:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap}
.small{padding:9px 12px;font-size:12px;border-radius:10px;background:rgba(0,0,0,0.6)}
.badge{padding:4px 10px;border-radius:999px;background:rgba(6,255,165,0.15);border:1px solid rgba(6,255,165,0.3);font-size:11px;color:#06ffa5}
#toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);padding:8px 14px;border-radius:999px;font-size:12px;opacity:0;transition:.3s;pointer-events:none}
#toast.show{opacity:1}
</style></head><body>
<header><div class="logo">QuantumCalc 3000</div><span class="badge">PBR FIXED v2</span></header>
<div id="container">
<div class="glass calc">
<div class="display"><div id="expr"></div><div id="result">0</div></div>
<div class="keys">
<button onclick="c()">AC</button><button onclick="del()">⌫</button><button onclick="add('%')">%</button><button class="op" onclick="add('/')">÷</button>
<button onclick="add('7')">7</button><button onclick="add('8')">8</button><button onclick="add('9')">9</button><button class="op" onclick="add('*')">×</button>
<button onclick="add('4')">4</button><button onclick="add('5')">5</button><button onclick="add('6')">6</button><button class="op" onclick="add('-')">−</button>
<button onclick="add('1')">1</button><button onclick="add('2')">2</button><button onclick="add('3')">3</button><button class="op" onclick="add('+')">+</button>
<button onclick="add('(')">(</button><button onclick="add('0')">0</button><button onclick="add(')')">)</button><button class="eq" onclick="eq()">=</button>
<button onclick="add('Math.sin(')">sin</button><button onclick="add('Math.cos(')">cos</button><button onclick="add('**')">^</button><button class="eq" style="font-size:12px" onclick="plotFromExpr()">Plot 3D</button>
</div>
<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
<button class="small" onclick="quickPlot('Math.sin(x)*Math.cos(y)')">sin·cos</button>
<button class="small" onclick="quickPlot('x*x - y*y')">x²-y²</button>
<button class="small" onclick="quickPlot('Math.sin(x*x+y*y)*1.2')">Ripple</button>
<button class="small" onclick="quickPlot('x*y*0.4')">x·y</button>
</div>
</div>
<div class="glass" id="canvasWrap"><canvas id="three"></canvas><div id="toast"></div>
<div class="controls">
<button class="small" onclick="setView('top')">Top</button>
<button class="small" onclick="setView('iso')">Iso</button>
<button class="small" onclick="toggleWire()">Wire</button>
<button class="small" onclick="randFunc()">Random</button>
<button class="small" onclick="exportPNG()">PNG</button>
</div></div>
</div>
<script type="module">
